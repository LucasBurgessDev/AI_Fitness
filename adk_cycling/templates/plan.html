{% extends "base.html" %}
{% block title %}Plan · Health Coach{% endblock %}

{% block head_extra %}
<script src="/static/chart.min.js"></script>
{% endblock %}

{% block page_style %}
<style>
  .page-main {
    flex: 1;
    padding: 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .toolbar h2 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; }
  .toolbar a { font-size: 0.82rem; color: var(--accent); text-decoration: none; }

  .card {
    background: var(--surface);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    margin-bottom: 1.25rem;
  }

  /* Empty state / new-plan form */
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.35rem; }
  .field input, .field select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 0.55rem 0.7rem; font-size: 0.9rem; font-family: inherit;
  }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 0.6rem 1.1rem; font-size: 0.88rem; font-weight: 600; cursor: pointer;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; color: var(--accent); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.4rem 0.8rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-secondary:hover { background: var(--surface-2); }
  .form-error { color: var(--watts); font-size: 0.82rem; margin-top: 0.5rem; }

  /* Header stats */
  .plan-header-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
  .stat-block { text-align: center; }
  .stat-block .stat-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 0.3rem; }
  .stat-block .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; color: var(--text); }
  .feasibility-note { margin-top: 0.9rem; padding: 0.7rem 0.9rem; border-radius: 8px; background: var(--amber-bg, rgba(255,184,48,0.1)); color: var(--text); font-size: 0.85rem; }

  /* Stage timeline */
  .stage-strip { display: flex; gap: 0.4rem; margin-top: 1rem; }
  .stage-block { flex: 1; text-align: center; padding: 0.5rem 0.3rem; border-radius: 8px; background: var(--surface-2); font-size: 0.72rem; color: var(--text-muted); border: 2px solid transparent; }
  .stage-block.current { border-color: var(--accent); color: var(--text); font-weight: 600; }

  /* Sessions table */
  table.sessions { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.sessions th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
  table.sessions td { padding: 0.6rem; border-bottom: 1px solid var(--border); }
  .status-pill { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 999px; font-weight: 600; }
  .status-pending { background: var(--surface-2); color: var(--text-muted); }
  .status-completed { background: rgba(0,224,155,0.15); color: var(--green); }
  .status-missed { background: rgba(255,79,31,0.15); color: var(--watts); }

  .chart-wrap { position: relative; height: 220px; }
  .loading-state { display: flex; align-items: center; justify-content: center; height: 220px; color: var(--text-muted); font-size: 0.875rem; gap: 0.5rem; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: var(--watts); font-size: 0.85rem; padding: 1rem; }
  .no-data { color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 2rem 1rem; }

  @media (max-width: 700px) {
    .plan-header-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .stage-strip { flex-wrap: wrap; }
    .stage-block { min-width: 45%; }
  }
</style>
{% endblock %}

{% block content %}
<div class="page-main">
  <div class="toolbar">
    <h2>Training Plan</h2>
    <a href="/chat">Ask the coach to adjust this →</a>
  </div>

  <div id="loading" class="loading-state"><div class="spinner"></div> Loading…</div>
  <div id="plan-root" style="display:none"></div>
</div>
{% endblock %}

{% block page_script %}
<script>
  const charts = {};
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function isDark() { return document.documentElement.getAttribute('data-theme') !== 'light'; }

  function chartDefaults() {
    const textColor = cssVar('--text');
    const mutedColor = cssVar('--text-muted');
    const gridColor = isDark() ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
    return {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: textColor, font: { size: 11 }, boxWidth: 12, padding: 12 } }, tooltip: { mode: 'index', intersect: false } },
      scales: {
        x: { ticks: { color: mutedColor, maxTicksLimit: 8, maxRotation: 0, font: { size: 10 } }, grid: { color: gridColor } },
        y: { ticks: { color: mutedColor, font: { size: 10 } }, grid: { color: gridColor } },
      },
    };
  }
  function makeChart(id, config) {
    if (charts[id]) charts[id].destroy();
    const canvas = document.getElementById(id);
    if (!canvas) return;
    charts[id] = new Chart(canvas, config);
  }

  const STATUS_LABEL = { pending: 'Upcoming', completed: 'Done', missed: 'Missed' };

  // Shared by the empty-state "set a goal" form and the active-plan "change goal"
  // form — both post to the same /api/plan/create, which fully replaces whatever
  // plan is currently active (re-baselined from current fitness).
  function goalFormHtml({ idPrefix, prefill = {}, submitLabel, warning }) {
    return `
      <form id="${idPrefix}-form">
        ${warning ? `<p style="color:var(--text-muted);font-size:0.82rem;margin-bottom:1rem">${warning}</p>` : ''}
        <div class="field">
          <label for="${idPrefix}-goal_text">Your goal</label>
          <input type="text" id="${idPrefix}-goal_text" name="goal_text"
            value="${(prefill.raw_text || '').replace(/"/g, '&quot;')}"
            placeholder="e.g. sub-5:00 century, build FTP to 250W, 10K PB" required />
        </div>
        <div class="field">
          <label for="${idPrefix}-target_date">Target date</label>
          <input type="date" id="${idPrefix}-target_date" name="target_date" value="${prefill.target_date || ''}" required />
        </div>
        <div class="field">
          <label for="${idPrefix}-discipline">Discipline</label>
          <select id="${idPrefix}-discipline" name="discipline">
            <option value="cycling" ${prefill.discipline === 'cycling' ? 'selected' : ''}>Cycling</option>
            <option value="running" ${prefill.discipline === 'running' ? 'selected' : ''}>Running</option>
          </select>
        </div>
        <button type="submit" class="btn-primary" id="${idPrefix}-submit">${submitLabel}</button>
        <div class="form-error" id="${idPrefix}-form-error"></div>
      </form>
    `;
  }

  let pendingOutgoingSummary = null;

  function wireGoalForm(idPrefix, submitLabel, busyLabel) {
    document.getElementById(`${idPrefix}-form`).addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById(`${idPrefix}-submit`);
      const errEl = document.getElementById(`${idPrefix}-form-error`);
      btn.disabled = true;
      btn.textContent = busyLabel;
      errEl.textContent = '';
      try {
        const form = new FormData(e.target);
        const res = await fetch('/api/plan/create', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
        pendingOutgoingSummary = data.outgoing_summary || null;
        await loadPlan();
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = submitLabel;
      }
    });
  }

  function renderEmptyState(root) {
    root.innerHTML = `
      <div class="card">
        <h3 style="margin-bottom:0.9rem">Set a training goal</h3>
        <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1.1rem">
          Tell the coach what you're working towards and by when — it'll build a week-by-week plan
          using your current fitness and equipment, then track progress as you go. You can also just
          describe this in <a href="/chat" style="color:var(--accent)">chat</a> instead.
        </p>
        ${goalFormHtml({ idPrefix: 'new', submitLabel: 'Build my plan' })}
      </div>
    `;
    wireGoalForm('new', 'Build my plan', 'Building…');
  }

  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

  function renderActivePlan(root, data) {
    const plan = data.plan;
    const goal = data.goal;
    const progress = data.progress;
    const todayIso = new Date().toISOString().slice(0, 10);
    const daysLeft = daysBetween(todayIso, goal.target_date);

    const overall = progress.overall_adherence_pct;
    const trajectoryLabel = { ahead: 'Ahead of pace', on_track: 'On track', behind: 'A bit behind' }[progress.trajectory_status] || 'Building a picture';

    let html = `
      ${pendingOutgoingSummary ? `<div class="feasibility-note" style="margin-bottom:1.25rem">${pendingOutgoingSummary}</div>` : ''}
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:0.9rem">
          <div style="font-size:0.95rem;font-weight:600">${goal.raw_text}</div>
          <button type="button" class="btn-secondary" id="toggle-change-goal">Change goal</button>
        </div>
        <div class="plan-header-grid">
          <div class="stat-block"><div class="stat-label">Target date</div><div class="stat-value" style="font-size:1.1rem">${goal.target_date}</div></div>
          <div class="stat-block"><div class="stat-label">Days left</div><div class="stat-value">${daysLeft >= 0 ? daysLeft : '—'}</div></div>
          <div class="stat-block"><div class="stat-label">On track?</div><div class="stat-value" style="font-size:1.1rem">${trajectoryLabel}</div></div>
          <div class="stat-block"><div class="stat-label">Sessions done</div><div class="stat-value">${overall != null ? overall + '%' : '—'}</div></div>
        </div>
        ${goal.feasibility_note ? `<div class="feasibility-note">${goal.feasibility_note}</div>` : ''}
        <div class="stage-strip">${renderStageStrip(plan, todayIso)}</div>
        <div id="change-goal-panel" style="display:none;margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--border)">
          ${goalFormHtml({
            idPrefix: 'change', prefill: goal, submitLabel: 'Replace plan',
            warning: `This replaces your current plan entirely (re-baselined from where your fitness is today) — it doesn't just tweak one field. ${overall != null ? `You're currently ${overall}% through the old one.` : ''}`,
          })}
        </div>
      </div>

      <div class="card">
        <h3 style="font-size:0.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.9rem">This week</h3>
        ${renderSessionsTable(plan.sessions, todayIso)}
      </div>

      <div class="card">
        <h3 style="font-size:0.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.9rem">Planned vs actual training load</h3>
        <div class="chart-wrap"><canvas id="chart-load"></canvas></div>
      </div>
    `;
    root.innerHTML = html;
    pendingOutgoingSummary = null;
    renderLoadChart(progress.weeks);
    wireGoalForm('change', 'Replace plan', 'Replacing…');
    document.getElementById('toggle-change-goal').addEventListener('click', () => {
      const panel = document.getElementById('change-goal-panel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
  }

  function renderStageStrip(plan, todayIso) {
    return (plan.phases || []).map(p => {
      const dates = (plan.sessions || []).filter(s => s.phase === p.name).map(s => s.date);
      const isCurrent = dates.length && todayIso >= dates[0] && todayIso <= dates[dates.length - 1];
      const label = { base: 'Foundation', build: 'Build', peak: 'Peak', taper: 'Taper' }[p.name] || p.name;
      return `<div class="stage-block ${isCurrent ? 'current' : ''}">${label}<br>${p.weeks}wk</div>`;
    }).join('');
  }

  function renderSessionsTable(sessions, todayIso) {
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - weekAgo.getDay() + 1);
    const weekStart = weekAgo.toISOString().slice(0, 10);
    const weekEndDate = new Date(weekAgo); weekEndDate.setDate(weekEndDate.getDate() + 6);
    const weekEnd = weekEndDate.toISOString().slice(0, 10);
    const week = sessions.filter(s => s.date >= weekStart && s.date <= weekEnd).sort((a, b) => a.date.localeCompare(b.date));
    if (!week.length) return '<div class="no-data">No sessions this week.</div>';
    const rows = week.map(s => `
      <tr>
        <td>${s.date}${s.date === todayIso ? ' (today)' : ''}</td>
        <td>${s.title}</td>
        <td>${s.target_duration_min ? s.target_duration_min + ' min' : '—'}</td>
        <td><span class="status-pill status-${s.status}">${STATUS_LABEL[s.status] || s.status}</span></td>
      </tr>`).join('');
    return `<div style="overflow-x:auto"><table class="sessions">
      <thead><tr><th>Date</th><th>Session</th><th>Duration</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  function renderLoadChart(weeks) {
    if (!weeks || !weeks.length) {
      document.getElementById('chart-load').parentElement.innerHTML = '<div class="no-data">Not enough data yet — check back after your first week.</div>';
      return;
    }
    const def = chartDefaults();
    makeChart('chart-load', {
      type: 'bar',
      data: {
        labels: weeks.map(w => w.week_start),
        datasets: [
          { label: 'Actual', data: weeks.map(w => w.actual_load), backgroundColor: isDark() ? 'rgba(0,200,255,0.55)' : 'rgba(0,127,168,0.55)', barPercentage: 0.7 },
          { label: 'Planned', data: weeks.map(w => w.planned_load), type: 'line', borderColor: cssVar('--amber'), borderDash: [4, 3], backgroundColor: 'transparent', pointRadius: 0, tension: 0 },
        ],
      },
      options: def,
    });
  }

  async function loadPlan() {
    const loading = document.getElementById('loading');
    const root = document.getElementById('plan-root');
    loading.style.display = 'flex';
    root.style.display = 'none';
    try {
      const res = await fetch('/api/plan/progress');
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      loading.style.display = 'none';
      root.style.display = 'block';
      if (!data.active) {
        renderEmptyState(root);
      } else {
        renderActivePlan(root, data);
      }
    } catch (err) {
      loading.innerHTML = `<div class="error-msg">⚠ ${err.message}</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadPlan);
</script>
{% endblock %}
